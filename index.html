<script>
const SLOT_SEC        = 7200;  // 2 h per episode slot
const VOCAL_END       = 77;   // episodes[0..76] vocal (pre-7.10.2023); [77..end] instrumental
// Broadcast day starts at 08:00 Israel time; Jan 3 2022 = first episode
const BROADCAST_EPOCH = new Date('2022-01-03T08:00:00+02:00').getTime();
const JINGLE_SEC      = 45;   // estimated jingle/intro at episode start (30–60 s)

// Deterministic Fisher-Yates shuffle — gives a fixed pseudo-random permutation of [0..n).
// Used so vocal episodes don't air in sequential order (ep N always followed by N+1).
// Seed is arbitrary but fixed; changing it would shift the entire vocal schedule.
function _makePermutation(n, seed) {
  const a = Array.from({length: n}, (_, i) => i);
  let s = seed >>> 0;
  for (let i = n - 1; i > 0; i--) {
    s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
    const j = s % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
// Vocal permutation is stable forever (77 is fixed by the Oct-2023 cutoff).
const VOCAL_PERM = _makePermutation(VOCAL_END, 0x4D49474C);

let episodes     = [];
let currentIndex = 0;
let playing      = false;

const player     = document.getElementById('player');
const iconPlay   = document.getElementById('iconPlay');
const iconPause  = document.getElementById('iconPause');
const loadingMsg = document.getElementById('loadingMsg');
const waveSvg    = document.getElementById('waveSvg');
const _waveLine  = waveSvg.querySelector('.wave-line');
const _waveLineB = waveSvg.querySelector('.wave-line-accent');

// Wave keyframes: each entry is { t: 0..1, y: [13 control-point Y values] }
const _WKA = [
  { t: 0.00, y: [22,22,22,22,22,22,22,22,22,22,22,22,22] },
  { t: 0.15, y: [28,12,34,16,36,10,30,14,38,18,32,14,26] },
  { t: 0.30, y: [18,36,10,32,14,38,12,34,16,36,12,30,18] },
  { t: 0.50, y: [30,10,38,14,30, 8,28,12,32,10,28, 8,24] },
  { t: 0.65, y: [16,34,12,36,16,34,14,38,12,34,16,38,20] },
  { t: 0.80, y: [26,14,32,18,38,16,36,18,36,14,36,18,28] },
  { t: 1.00, y: [22,22,22,22,22,22,22,22,22,22,22,22,22] },
];
const _WKB = [
  { t: 0.00, y: [22,22,22,22,22,22,22,22,22,22,22,22,22] },
  { t: 0.20, y: [14,30, 8,26,10,32,16,28,10,30,14,28,18] },
  { t: 0.40, y: [32,16,36,12,32,14,34,16,34,12,32,14,30] },
  { t: 0.60, y: [20,38,14,30,12,36,18,36,14,32,18,36,20] },
  { t: 0.80, y: [34,14,30,10,28,10,26,14,30,14,28,12,24] },
  { t: 1.00, y: [22,22,22,22,22,22,22,22,22,22,22,22,22] },
];
const _WXS = [0,35,70,105,140,175,210,245,280,315,350,385,420];
const _FLAT = 'M0,22 L420,22';

function _buildWavePath(ys) {
  return `M${_WXS[0]},${ys[0]|0} C${_WXS[1]},${ys[1]|0} ${_WXS[2]},${ys[2]|0} ${_WXS[3]},${ys[3]|0} C${_WXS[4]},${ys[4]|0} ${_WXS[5]},${ys[5]|0} ${_WXS[6]},${ys[6]|0} C${_WXS[7]},${ys[7]|0} ${_WXS[8]},${ys[8]|0} ${_WXS[9]},${ys[9]|0} C${_WXS[10]},${ys[10]|0} ${_WXS[11]},${ys[11]|0} ${_WXS[12]},${ys[12]|0}`;
}
function _eio(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }
function _waveYs(kfs, phase) {
  let k1 = kfs[0], k2 = kfs[1];
  for (let i = 0; i < kfs.length - 1; i++) {
    if (phase <= kfs[i+1].t) { k1 = kfs[i]; k2 = kfs[i+1]; break; }
  }
  const span = k2.t - k1.t || 1;
  const t = _eio((phase - k1.t) / span);
  return k1.y.map((v, i) => v + (k2.y[i] - v) * t);
}
let _waveRaf = null, _waveT0 = null;
function _waveFrame(ts) {
  if (!_waveT0) _waveT0 = ts;
  const e = ts - _waveT0;
  _waveLine.setAttribute('d',  _buildWavePath(_waveYs(_WKA, (e % 4000) / 4000)));
  _waveLineB.setAttribute('d', _buildWavePath(_waveYs(_WKB, ((e + 1100) % 3200) / 3200)));
  _waveRaf = requestAnimationFrame(_waveFrame);
}
function _startWave() { if (!_waveRaf) { _waveT0 = null; _waveRaf = requestAnimationFrame(_waveFrame); } }
function _stopWave()  { if (_waveRaf) { cancelAnimationFrame(_waveRaf); _waveRaf = null; } _waveLine.setAttribute('d', _FLAT); _waveLineB.setAttribute('d', _FLAT); }

function setPlayingState(state) {
  playing = state;
  iconPlay.style.display  = state ? 'none' : '';
  iconPause.style.display = state ? ''     : 'none';
  state ? _startWave() : _stopWave();
  document.getElementById('btnPlay').classList.toggle('is-playing', state);
  if (state) document.getElementById('nowPlaying').style.display = '';
  if ('mediaSession' in navigator)
    navigator.mediaSession.playbackState = state ? 'playing' : 'paused';
}

// Detect text direction: RTL if the first strong character is Hebrew/Arabic
function textDir(s) {
  const m = (s || '').match(/[A-Za-z֐-׿؀-ۿ]/);
  if (!m) return 'ltr';
  return /[֐-׿؀-ۿ]/.test(m[0]) ? 'rtl' : 'ltr';
}

function updateTrackDisplay(currentTime) {
  const ep = episodes[currentIndex];
  if (!ep || !ep.tracks || ep.tracks.length === 0) {
    document.getElementById('trackNow').style.display = 'none';
    return;
  }
  const tracks = ep.tracks;
  const epDur = (player.duration && isFinite(player.duration)) ? player.duration : SLOT_SEC;

  // Total declared track time; may differ from epDur due to estimation errors
  const totalTrackSec = tracks.reduce((s, t) => s + (t.ms || 0) / 1000, 0);
  // Effective music window: starts after jingle, ends at episode end
  const musicDur = Math.max(totalTrackSec, epDur - JINGLE_SEC);

  // Forward pass — offset by jingle so track 0 starts at JINGLE_SEC
  const musicTime = Math.max(0, currentTime - JINGLE_SEC);
  let fwdElapsed = 0, fwdIdx = tracks.length - 1;
  for (let i = 0; i < tracks.length; i++) {
    const dur = (tracks[i].ms || 0) / 1000;
    if (musicTime < fwdElapsed + dur) { fwdIdx = i; break; }
    fwdElapsed += dur;
  }

  // Backward pass — anchored from the end of the episode
  const timeFromEnd = Math.max(0, epDur - currentTime);
  let bwdElapsed = 0, bwdIdx = 0;
  for (let i = tracks.length - 1; i >= 0; i--) {
    const dur = (tracks[i].ms || 0) / 1000;
    if (timeFromEnd < bwdElapsed + dur) { bwdIdx = i; break; }
    bwdElapsed += dur;
  }

  // Near start → trust forward; near end → trust backward
  const w = Math.max(0, Math.min(1, musicTime / Math.max(1, musicDur)));
  const blended = Math.round(fwdIdx * (1 - w) + bwdIdx * w);
  const track = tracks[Math.min(Math.max(blended, 0), tracks.length - 1)];

  const artistEl = document.getElementById('trackArtist');
  artistEl.textContent = track.a || '';
  artistEl.dir = textDir(track.a);
  artistEl.style.display = track.a ? '' : 'none';
  const titleEl = document.getElementById('trackTitle');
  titleEl.textContent = track.t || '';
  titleEl.dir = textDir(track.t);
  document.getElementById('trackNow').style.display = '';
}

function updateUI(index) {
  const ep = episodes[index];
  const epTitleEl = document.getElementById('epTitle');
  epTitleEl.textContent = ep.title;
  epTitleEl.dir = textDir(ep.title);
  document.getElementById('epDate').textContent  = ep.date || '';
  document.getElementById('epLink').href = ep.url;
  document.getElementById('trackNow').style.display = 'none';
}

const ARTWORK = [{ src: 'https://lighthouse-radio.github.io/migdalor/logo.png', sizes: '500x500', type: 'image/png' }];

function updateMediaSession(ep) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title:   ep.title,
    artist:  'Lighthouse Radio | רדיו מגדלור',
    album:   '',
    artwork: ARTWORK,
  });
  navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
  navigator.mediaSession.setActionHandler('play',  () => { setPlayingState(true);  player.play().catch(()=>{}); });
  navigator.mediaSession.setActionHandler('pause', () => { setPlayingState(false); player.pause(); });
  navigator.mediaSession.setActionHandler('stop',  () => { setPlayingState(false); player.pause(); });
  navigator.mediaSession.setActionHandler('nexttrack',     () => playRandom());
  navigator.mediaSession.setActionHandler('previoustrack', () => {
    const prev = (currentIndex - 1 + episodes.length) % episodes.length;
    setPlayingState(true);
    loadEpisode(prev, 0);
  });
  // Disable seek arrows — this is a radio station, not a podcast scrubber
  try { navigator.mediaSession.setActionHandler('seekforward',  null); } catch(e) {}
  try { navigator.mediaSession.setActionHandler('seekbackward', null); } catch(e) {}
  updatePositionState();
}

function updatePositionState() {
  if (!('mediaSession' in navigator) || !isFinite(player.duration)) return;
  try {
    navigator.mediaSession.setPositionState({
      duration:     player.duration,
      playbackRate: player.playbackRate || 1,
      position:     Math.min(player.currentTime, player.duration),
    });
  } catch(e) {}
}

// Keep lock-screen playback state in sync with OS-initiated play/pause
// (phone call, Siri, Bluetooth disconnect, etc.)
player.addEventListener('play',  () => {
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
});
player.addEventListener('pause', () => {
  // Only mark as paused if the user intended to stop — not during seek/load
  if ('mediaSession' in navigator && !_seeking)
    navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
});

function loadEpisode(index, seekTo) {
  currentIndex = index;
  updateUI(index);
  const ep = episodes[index];

  // Suppress timeupdate immediately — don't show stale track during load+seek
  _seeking = true;
  document.getElementById('trackNow').style.display = 'none';

  player.src = ep.mp3;
  player.load();
  loadingMsg.textContent = 'טוען...';

  // Start playback immediately (before canplay) when no seek is needed.
  // On iOS, calling play() right after load() keeps the audio session alive across
  // episode transitions in the background — without this, the OS ends the session
  // during the canplay wait and blocks the subsequent play() call.
  if (seekTo === 0 && playing) {
    player.play().catch(() => {});
  }

  player.addEventListener('canplay', function onReady() {
    player.removeEventListener('canplay', onReady);
    loadingMsg.textContent = '';
    if (seekTo > 0 && seekTo < (player.duration || SLOT_SEC)) {
      player.currentTime = seekTo;
      // _seeking stays true until the 'seeked' event fires
    } else {
      // No seek needed — release immediately and show correct track
      _seeking = false;
      updateTrackDisplay(player.currentTime);
    }
    updateMediaSession(ep);
    // Only call play() if not already playing (the early call above may have succeeded)
    if (playing && player.paused) player.play().catch(() => {});
  }, { once: true });

  player.addEventListener('error', function onErr() {
    player.removeEventListener('error', onErr);
    loadingMsg.textContent = '';
    if (playing) loadEpisode((currentIndex + 1) % episodes.length, 0);
  }, { once: true });
}

player.addEventListener('ended', () => {
  loadEpisode((currentIndex + 1) % episodes.length, 0);
});

let _seeking = false;
let _lastDisplayTime = -1;

player.addEventListener('seeking', () => {
  _seeking = true;
  document.getElementById('trackNow').style.display = 'none';
});
player.addEventListener('seeked',  () => {
  _seeking = false;
  _lastDisplayTime = -1;
  updateTrackDisplay(player.currentTime);
  updatePositionState();
});
player.addEventListener('timeupdate', () => {
  if (!_seeking) {
    updateTrackDisplay(player.currentTime);
    updatePositionState();
  }
});

// Resume after phone-call / audio-session interruption (immediate, on app foreground)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && playing && player.paused && !_seeking && player.readyState >= 2) {
    player.play().catch(() => {});
  }
});

// Heartbeat: timeupdate is unreliable on iOS/mobile — fires every 5 s as a safety net
// Also catches interruption recovery when visibility doesn't change (e.g. already in foreground)
setInterval(() => {
  if (playing && player.paused && !_seeking && player.readyState >= 2) {
    player.play().catch(() => {});
  }
  if (!_seeking && playing && player.currentTime !== _lastDisplayTime) {
    _lastDisplayTime = player.currentTime;
    updateTrackDisplay(player.currentTime);
  }
}, 5000);

function togglePlay() {
  if (playing) {
    player.pause();
    setPlayingState(false);
  } else {
    setPlayingState(true);
    if (player.readyState >= 2) {
      player.play().catch(() => {});
    } else {
      const sched = calcSchedule();
      currentIndex = sched.idx;
      loadEpisode(sched.idx, sched.seek);
    }
  }
}

function playRandom() {
  let idx;
  do { idx = Math.floor(Math.random() * episodes.length); }
  while (idx === currentIndex && episodes.length > 1);
  setPlayingState(true);
  loadEpisode(idx, 0);
}

function _israelSec() {
  const parts = new Intl.DateTimeFormat('en', {
    timeZone: 'Asia/Jerusalem',
    hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: false
  }).formatToParts(new Date());
  const h = +parts.find(p => p.type === 'hour').value;
  const m = +parts.find(p => p.type === 'minute').value;
  const s = +parts.find(p => p.type === 'second').value;
  return h * 3600 + m * 60 + s;
}

function calcSchedule() {
  const now = new Date();
  const sec = _israelSec();

  // "Broadcast day" runs 08:00–08:00 (next day).
  // broadcastSec: seconds elapsed since 08:00 today (or yesterday if before 08:00).
  const broadcastSec = sec >= 8 * 3600 ? sec - 8 * 3600 : sec + 16 * 3600;
  const broadcastDay = Math.floor((now.getTime() - BROADCAST_EPOCH) / 86400000);

  // Each broadcast day has 12 day-slots (0-5) and 12 night-slots (6-11).
  const slotInDay = Math.floor(broadcastSec / SLOT_SEC); // 0-11
  const isDay     = slotInDay < 6;                       // 0-5 = day, 6-11 = night
  const seek      = broadcastSec % SLOT_SEC;

  if (isDay) {
    // Vocal pool: use fixed permutation so episodes don't air in sequential order.
    // VOCAL_PERM cycles through all 77 episodes pseudo-randomly (~13 days per cycle).
    const daySlot = broadcastDay * 6 + slotInDay;
    const idx     = VOCAL_PERM[daySlot % VOCAL_END];
    return { idx, seek };
  } else {
    // Instrumental pool: use a prime step (97) coprime to virtually all pool sizes,
    // so episodes are spread non-sequentially without a fixed permutation that would
    // shift every time a new episode is added.
    const nightSlot = broadcastDay * 6 + (slotInDay - 6);
    const pool      = episodes.length - VOCAL_END;
    // 97 is prime; gcd(97, pool) = 1 for all realistic pool sizes (would need exactly
    // 97 instrumental episodes to fail — currently ~110, grows weekly).
    const INST_STEP = (pool % 97 !== 0) ? 97 : 101;
    const idx       = VOCAL_END + (nightSlot * INST_STEP) % pool;
    return { idx, seek };
  }
}
