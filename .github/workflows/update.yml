name: Update episodes

on:
  schedule:
    - cron: '0 6 * * 2'   # Every Tuesday at 06:00 UTC (09:00 Israel time, after Monday evening show)
  workflow_dispatch:        # Also allows manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Run incremental update
        run: perl scripts/update.pl

      - name: Embed episodes into index.html
        run: perl scripts/embed.pl

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes.json index.html
          git diff --cached --quiet || git commit -m "Update episodes [$(date +%Y-%m-%d)]"
          git push
